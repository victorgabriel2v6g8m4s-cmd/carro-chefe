<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso administrativo CookLily</title><body style="margin:0;background:#fff6fa;color:#4d0028;font:600 16px system-ui;display:grid;min-height:100vh;place-items:center"><p id="status" role="status" aria-live="polite">Validando o acesso seguro…</p><script>
const status=document.querySelector("#status"),ticket=new URLSearchParams(location.hash.slice(1)).get("ticket"),prefix=location.pathname.startsWith("/cook/")?"/cook":location.pathname.startsWith("/lilyacai/")?"/lilyacai":null;history.replaceState(history.state,"",location.pathname);if(!prefix||!ticket||!/^[\w-]{40,60}$/.test(ticket)){status.textContent="Acesso expirado ou rota inválida. Execute novamente o comando de autenticação."}else fetch("/api/v1/lily/auth/agent/exchange",{method:"POST",headers:{"Content-Type":"application/json"},cache:"no-store",body:JSON.stringify({ticket})}).then(async r=>{if(!r.ok){const data=await r.json().catch(()=>({})),code=typeof data.code==="string"&&/^[A-Z0-9_]{2,64}$/.test(data.code)?data.code:null,requestId=r.headers.get("x-request-id")||r.headers.get("x-correlation-id");throw new Error([`HTTP ${r.status}`,code,requestId?`referência ${requestId}`:null].filter(Boolean).join(" · "))}status.textContent="Acesso confirmado. Abrindo o painel…";setTimeout(()=>location.replace(`${prefix}/painel`),250)}).catch(error=>{status.textContent=`Não foi possível concluir o acesso (${error instanceof Error?error.message:"falha inesperada"}). Execute novamente o comando.`});
</script></body></html>
