<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso administrativo CookLily</title><body style="margin:0;background:#fff6fa;color:#4d0028;font:600 16px system-ui;display:grid;min-height:100vh;place-items:center"><p id="status" role="status" aria-live="polite">Validando o acesso seguro…</p><script>
const status=document.querySelector("#status"),ticket=new URLSearchParams(location.hash.slice(1)).get("ticket");history.replaceState(history.state,"",location.pathname);if(!ticket||!/^[\w-]{40,60}$/.test(ticket)){status.textContent="Acesso expirado. Execute novamente o comando de autenticação."}else fetch("/api/v1/lily/auth/agent/exchange",{method:"POST",headers:{"Content-Type":"application/json"},cache:"no-store",body:JSON.stringify({ticket})}).then(r=>{if(!r.ok)throw 0;status.textContent="Acesso confirmado. Abrindo o painel…";setTimeout(()=>location.replace("/lilyacai/painel"),250)}).catch(()=>{status.textContent="Não foi possível concluir o acesso. Execute novamente o comando."});
</script></body></html>
