openapi: 3.1.0
info:
  title: Carro Chefe — Central Operacional API
  version: 1.0.0
  description: Contratos para pessoas, agentes, ERP e automações. O acesso é somente local enquanto a autenticação de produção não estiver pronta.
servers:
  - url: http://127.0.0.1:4173/api/v1
paths:
  /bootstrap:
    get:
      summary: Retorna projeto, plano e visão operacional agregada
      responses: { "200": { description: Estado atual } }
  /tasks:
    get:
      summary: Lista tarefas com filtros opcionais
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: owner, schema: { type: string } }
        - { in: query, name: phase, schema: { type: string } }
        - { in: query, name: q, schema: { type: string } }
      responses: { "200": { description: Tarefas } }
  /tasks/{taskId}:
    get:
      summary: Abre tarefa, dependências, transições, execuções, perguntas e arquivos
      parameters: [ { $ref: "#/components/parameters/TaskId" } ]
      responses: { "200": { description: Tarefa }, "404": { description: Não encontrada } }
  /tasks/{taskId}/status-transitions:
    post:
      summary: Muda status com justificativa e controle otimista
      parameters: [ { $ref: "#/components/parameters/TaskId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskTransition" }
      responses: { "200": { description: Transição registrada }, "409": { description: Versão desatualizada } }
  /me/ui-state/{scope}:
    get:
      summary: Recupera o último ponto do usuário
      parameters: [ { in: path, name: scope, required: true, schema: { type: string } } ]
      responses: { "200": { description: Estado da interface } }
    put:
      summary: Salva rota, filtros, scroll e menu
      parameters: [ { in: path, name: scope, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Estado salvo } }
  /agent-runs:
    get:
      summary: Lista execuções de agentes
      responses: { "200": { description: Execuções } }
    post:
      summary: Cria uma execução vinculada à tarefa e ao agente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRun" }
      responses: { "201": { description: Execução criada } }
  /intents:
    get:
      summary: Lista comandos operacionais e o progresso agregado
      responses: { "200": { description: Comandos } }
    post:
      summary: Classifica uma orientação em linguagem natural e despacha aos agentes responsáveis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, minLength: 8 }
                submittedBy: { type: string, default: proprietario }
                attachmentIds: { type: array, maxItems: 12, items: { type: string } }
      responses: { "201": { description: Comando registrado e execuções criadas } }
  /intents/{intentId}:
    get:
      summary: Mostra fatos, agentes, passos e resultado de um comando
      parameters: [ { in: path, name: intentId, required: true, schema: { type: string } } ]
      responses: { "200": { description: Comando detalhado } }
  /notifications:
    get:
      summary: Lista notificações do proprietário
      responses: { "200": { description: Notificações } }
  /agent-runs/{runId}/claim:
    post:
      summary: Permite que um worker assuma atomicamente uma execução na fila
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses: { "200": { description: Execução assumida }, "409": { description: Já assumida } }
  /agent-runs/{runId}/steps:
    post:
      summary: Cria ou atualiza um passo do procedimento
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentStep" } } } }
      responses: { "200": { description: Passo registrado } }
  /agent-runs/{runId}/questions:
    post:
      summary: Faz uma pergunta contextual ao proprietário
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentQuestion" } } } }
      responses: { "201": { description: Pergunta registrada } }
  /agent-questions/{questionId}/answer:
    post:
      summary: Responde ao agente e devolve a execução à fila
      parameters: [ { in: path, name: questionId, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [answer], properties: { answer: { type: string }, answeredBy: { type: string }, attachmentIds: { type: array, maxItems: 12, items: { type: string } }, references: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/ScopedReference" } } } } } } }
      responses: { "200": { description: Resposta registrada } }
  /agent-runs/{runId}/send:
    post:
      summary: Acumula uma consulta curta para outro agente; a Central completa o contexto e a auditoria
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentDispatch" } } } }
      responses: { "201": { description: Consulta armazenada para despacho em lote } }
  /agent-runs/{runId}/dispatches:
    get:
      summary: Lista consultas e resultados vinculados à execução
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses: { "200": { description: Consultas acumuladas } }
  /agent-runs/{runId}/dispatches/flush:
    post:
      summary: Agrupa consultas por agente e cria uma única execução para cada destino
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses: { "200": { description: Execuções consolidadas criadas } }
  /agent-dispatches/{dispatchId}/context:
    get:
      summary: Retorna o contexto compacto resolvido pela Central para uma consulta
      parameters: [ { in: path, name: dispatchId, required: true, schema: { type: string } } ]
      responses: { "200": { description: Contexto, dependências e ações de sucesso } }
  /references:
    get:
      summary: Lista referências selecionáveis com @ no projeto ou no escopo de uma tarefa
      parameters:
        - { in: query, name: taskId, schema: { type: string } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, maximum: 150 } }
      responses: { "200": { description: Tarefas, decisões, riscos, compras, execuções e arquivos referenciáveis } }
  /management-conversations:
    get:
      summary: Lista conversas contínuas do proprietário com a Gestão
      responses: { "200": { description: Conversas e mensagens } }
    post:
      summary: Abre uma conversa que não cria tarefa no roteiro
      responses: { "201": { description: Conversa criada } }
  /management-conversations/{conversationId}:
    get:
      summary: Recupera mensagens, anexos, referências e execuções da conversa
      parameters: [ { in: path, name: conversationId, required: true, schema: { type: string } } ]
      responses: { "200": { description: Conversa completa } }
  /management-conversations/{conversationId}/messages:
    post:
      summary: Envia mensagem à Gestão sem disparar uma tarefa
      parameters: [ { in: path, name: conversationId, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ManagementMessage" } } } }
      responses: { "201": { description: Mensagem registrada e execução de conversa enfileirada } }
  /agent-runs/{runId}/usage:
    post:
      summary: Registra uso medido ou explicitamente estimado
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { description: Uso registrado } }
  /agent-runs/{runId}/logs:
    get:
      summary: Lista atividade e saída de terminal persistidas da execução
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses: { "200": { description: Logs ordenados por sequência } }
    post:
      summary: Registra um evento incremental emitido pelo runtime do agente
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses: { "201": { description: Evento registrado e publicado por SSE } }
  /agent-runs/{runId}/report:
    post:
      summary: Consolida resultado, diagnóstico, sucessos, falhas, evidências e próximos passos
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentRunReport" } } } }
      responses: { "200": { description: Relatório criado ou atualizado } }
  /agent-runs/{runId}/communications:
    post:
      summary: Registra fluxo direcional entre proprietário e agentes
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCommunication" } } } }
      responses: { "201": { description: Comunicação registrada e publicada por SSE } }
  /agent-communications:
    get:
      summary: Lista comunicações para compor o mapa de fluxo
      parameters:
        - { in: query, name: runId, schema: { type: string } }
        - { in: query, name: intentId, schema: { type: string } }
      responses: { "200": { description: Fluxo cronológico de comunicação } }
  /agents/{agentId}/stats:
    get:
      summary: Calcula configurações, interações, sucesso, falha, desempenho e consumo do agente
      parameters: [ { in: path, name: agentId, required: true, schema: { type: string } } ]
      responses: { "200": { description: Estatísticas do agente } }
  /agent-runs/{runId}/browser-navigations:
    post:
      summary: Solicita que o navegador integrado abra uma URL, arquivo ou anexo ligado à execução
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses: { "201": { description: Navegação registrada e publicada por SSE } }
  /decisions/{decisionId}/context:
    post:
      summary: Acrescenta contexto e fonte sem reescrever o histórico da decisão
      parameters: [ { in: path, name: decisionId, required: true, schema: { type: string } } ]
      responses: { "201": { description: Informação preservada } }
  /decisions/{decisionId}/status:
    post:
      summary: Resolve ou cancela uma decisão com justificativa auditável
      parameters: [ { in: path, name: decisionId, required: true, schema: { type: string } } ]
      responses: { "200": { description: Decisão atualizada } }
  /uploads:
    get:
      summary: Lista evidências vinculadas
      responses: { "200": { description: Arquivos } }
    post:
      summary: Envia evidência permitida de até 10 MB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                taskId: { type: string }
                runId: { type: string }
                intentId: { type: string }
                decisionId: { type: string }
                purpose: { enum: [intent-draft, question-answer-draft, management-message-draft] }
                actor: { type: string }
      responses: { "201": { description: Evidência armazenada }, "415": { description: Tipo não permitido } }
  /events:
    get:
      summary: Stream SSE; suporta Last-Event-ID
      responses: { "200": { description: Fluxo text/event-stream } }
  /integrations/{provider}/webhook:
    post:
      summary: Recebe evento externo com HMAC e idempotência
      parameters:
        - { in: path, name: provider, required: true, schema: { type: string } }
        - { in: header, name: X-CarroChefe-Signature, required: true, schema: { type: string } }
        - { in: header, name: X-Idempotency-Key, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "202": { description: Evento aceito }, "401": { description: Assinatura inválida } }
components:
  parameters:
    TaskId: { in: path, name: taskId, required: true, schema: { type: string } }
    RunId: { in: path, name: runId, required: true, schema: { type: string } }
  schemas:
    TaskTransition:
      type: object
      required: [toStatus, justification, actor, expectedVersion]
      properties:
        toStatus: { enum: [backlog, ready, in_progress, blocked, review, done, cancelled] }
        justification: { type: string, minLength: 8 }
        actor: { type: string }
        expectedVersion: { type: integer, minimum: 1 }
        evidence: { type: array, items: { type: string }, default: [] }
    CreateRun:
      type: object
      required: [agentId, title, objective, requestedBy]
      properties:
        taskId: { type: [string, "null"], description: Obrigatória, exceto em management_chat }
        agentId: { type: string }
        title: { type: string }
        objective: { type: string }
        provider: { enum: [manual, codex-local], default: manual }
        purpose: { enum: [execution, management_review, management_chat, consultation], default: execution }
        requestedBy: { type: string }
    AgentStep:
      type: object
      required: [order, title]
      properties:
        order: { type: integer, minimum: 1 }
        title: { type: string }
        description: { type: [string, "null"] }
        status: { enum: [pending, in_progress, completed, failed] }
        procedure: { type: [string, "null"] }
        result: { type: [string, "null"] }
    AgentQuestion:
      type: object
      required: [askedBy, question, context]
      properties:
        askedBy: { type: string }
        question: { type: string }
        context: { type: string }
        recommendation: { type: [string, "null"] }
        options: { type: array, items: { type: string } }
        blocking: { type: boolean, default: true }
    AgentRunReport:
      type: object
      required: [outcome, summary, generatedBy]
      properties:
        outcome: { enum: [succeeded, partial, failed, waiting_input, cancelled] }
        summary: { type: string }
        diagnosis: { type: [string, "null"] }
        successes: { type: array, items: { type: string } }
        failures: { type: array, items: { type: string } }
        recommendations: { type: array, items: { type: string } }
        evidence: { type: array, items: { type: string } }
        generatedBy: { type: string }
    AgentCommunication:
      type: object
      required: [sourceId, targetId, kind, summary]
      properties:
        sourceId: { type: string }
        targetId: { type: string }
        kind: { enum: [delegation, coordination, handoff, question, answer, result, decision, update] }
        status: { enum: [planned, delivered, acknowledged, failed] }
        summary: { type: string }
        intentId: { type: [string, "null"] }
        metadata: { type: object }
    ScopedReference:
      type: object
      required: [id, type, label]
      properties:
        id: { type: string }
        type: { enum: [task, decision, risk, procurement, upload, run, file, url] }
        label: { type: string }
        route: { type: [string, "null"] }
    AgentDispatch:
      type: object
      required: [to, msg]
      properties:
        to: { type: string, example: AG-MARKETING }
        msg: { type: string }
        data: { type: [string, "null"], description: Ponteiro compacto de contexto }
        isRequiredToProceed: { type: boolean, default: false }
        dependencies: { type: array, items: { type: string } }
        onSuccess:
          type: object
          properties: { unlock: { type: array, items: { type: string } } }
    ManagementMessage:
      type: object
      required: [content]
      properties:
        content: { type: string }
        submittedBy: { type: string, default: PROPRIETARIO }
        attachmentIds: { type: array, maxItems: 12, items: { type: string } }
        references: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/ScopedReference" } }
