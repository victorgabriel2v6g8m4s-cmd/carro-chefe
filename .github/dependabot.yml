version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: America/Campo_Grande
    open-pull-requests-limit: 5
    # O quality gate oficial ainda cobre Node 20 e Node 24.
    # Não oferecer majors que já exigem Node >=22 enquanto Node 20 for suportado.
    ignore:
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: better-sqlite3
        update-types:
          - version-update:semver-major
    groups:
      production-dependencies:
        dependency-type: production
        patterns: ["*"]
      development-dependencies:
        dependency-type: development
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "09:20"
      timezone: America/Campo_Grande
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
