name: CookLily Apply Fruit Gelato Excel Once

on:
  push:
    branches: [lily-acai]
    paths:
      - "docs/lily-acai/.gelato-frutas-apply"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: lily-acai
          fetch-depth: 0
      - name: Install snapshot dependencies
        run: python -m pip install -r tools/excel_snapshot/requirements.txt
      - name: Policy preflight
        run: npm run policy:preflight -- --agent AG-FINANCAS --scope anexos/financeiro
      - name: Validate recipe
        run: python -m tools.excel_recipe validate anexos/financeiro/recipes/cooklily-milkshake-gelato-frutas-2026-09-24.json
      - name: Plan recipe
        run: python -m tools.excel_recipe plan anexos/financeiro/recipes/cooklily-milkshake-gelato-frutas-2026-09-24.json
      - name: Apply recipe
        run: python -m tools.excel_recipe apply anexos/financeiro/recipes/cooklily-milkshake-gelato-frutas-2026-09-24.json
      - name: Verify evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f "anexos/financeiro/recipes/receipts/cooklily-milkshake-gelato-frutas-2026-09-24.receipt.json"
          git diff --exit-code -- "tools/excel_recipe"
          git status --short
      - name: Commit generated workbook evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CookLily Excel Recipe Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "anexos/financeiro/carro chefe.xlsm"                   "anexos/financeiro/snapshot"                   "anexos/financeiro/recipes/receipts/cooklily-milkshake-gelato-frutas-2026-09-24.receipt.json"
          git diff --cached --quiet && { echo "Nenhuma alteração gerada."; exit 1; }
          git commit -m "data(lily): aplica sabores de fruta do gelato"
          git push origin HEAD:lily-acai
