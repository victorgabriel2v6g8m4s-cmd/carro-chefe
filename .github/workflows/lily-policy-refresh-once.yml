name: Lily Policy Manifest Refresh Once

on:
  push:
    branches:
      - lily-acai
    paths:
      - "docs/lily-acai/.policy-refresh-trigger"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build policy manifest
        run: npm run policy:build
      - name: Verify policy manifest
        run: npm run policy:check
      - name: Commit generated manifest
        shell: bash
        run: |
          set -euo pipefail
          git add .agent-policy/manifest.json
          if git diff --cached --quiet; then
            echo "Manifesto já estava sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(lily): refresh policy manifest output"
          git push origin HEAD:lily-acai
