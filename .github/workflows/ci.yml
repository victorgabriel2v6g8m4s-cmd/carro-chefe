name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Validate tracked files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(\.env($|\.)|\.runtime/)|\.(pem|key|p12|pfx)$' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Arquivos sensíveis ou de runtime não podem ser versionados:"
            echo "$forbidden"
            exit 1
          fi

      - name: Validate agent policy manifest
        run: npm run policy:check

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare database
        env:
          DATABASE_URL: file:./.runtime/ci.db
        run: |
          mkdir -p .runtime
          npm run db:deploy

      - name: Static checks
        env:
          DATABASE_URL: file:./.runtime/ci.db
        run: npm run check

      - name: Tests
        env:
          DATABASE_URL: file:./.runtime/ci.db
        run: npm test

      - name: Production builds
        env:
          DATABASE_URL: file:./.runtime/ci.db
        run: npm run build

  windows-supervisor:
    name: Windows Supervisor
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile native supervisor
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/windows-supervisor/build.ps1
          if (-not (Test-Path tools/windows-supervisor/bin/CarroChefeSupervisor.exe)) { throw "Executável não foi gerado." }
