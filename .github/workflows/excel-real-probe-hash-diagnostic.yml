name: Excel Real Probe Hash Diagnostic

on:
  push:
    branches: [lily-acai]
    paths:
      - "docs/lily-acai/.excel-probe-hash-diagnostic"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: V3A plans
        shell: bash
        run: |
          python -m tools.excel_recipe plan tools/excel_recipe/examples/probe-v3a-clean-custos-fixos.json
          python -m tools.excel_recipe plan tools/excel_recipe/examples/probe-v3a-blocked-configuracoes.json
      - name: V3B canonical plan
        shell: bash
        run: |
          python - <<'PY'
          import json
          from tools.excel_recipe.package import PackageEditor
          from tools.excel_recipe.workbook import WorkbookContext
          from tools.excel_recipe.structural_v3b import V3BStructuralPlanner
          from tools.excel_recipe.probe_v3b_real import WORKBOOK, _select_clean_plan, BLOCKED_SHEET
          package = PackageEditor(WORKBOOK)
          planner = V3BStructuralPlanner(WorkbookContext(package), WORKBOOK.parents[2])
          operation, plan = _select_clean_plan(planner)
          blocked = planner.plan({"op":"structural.plan","action":"sheet.insert_rows","sheet":BLOCKED_SHEET,"at":1,"count":1})
          print("V3B_DIAGNOSTIC=" + json.dumps({
            "operation": operation,
            "plan_sha256": plan["plan_sha256"],
            "blocked_plan_sha256": blocked["plan_sha256"],
            "blocked_kinds": sorted({x["kind"] for x in blocked["blockers"]}),
          }, sort_keys=True))
          PY
