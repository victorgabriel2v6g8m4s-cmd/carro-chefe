name: Excel Fruit Pin Preflight

on:
  push:
    branches: [lily-acai]
    paths:
      - "docs/lily-acai/.excel-fruit-pin-preflight"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm run policy:preflight -- --agent AG-DEV --scope tools/excel_recipe
